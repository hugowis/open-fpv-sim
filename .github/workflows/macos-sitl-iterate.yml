name: macos-sitl-iterate

# TEMPORARY (issue #68): builds the SITL on macOS and runs what builds, to iterate on the macOS patch quickly.
# Removed before the pull request.
on:
  push:
    branches: [worktree-m9c-macos-survey]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/macos-survey.yml'

permissions:
  contents: read

jobs:
  sitl:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash scripts/macos-survey.sh sitl-build-patched env BF_DIR="$RUNNER_TEMP/bf" bash scripts/build-sitl.sh
      - name: errors of the patched build
        run: |
          grep -E "error|Error" -A3 survey/sitl-build-patched.log | grep -v "warning" | head -60 || true
      - name: SITL live tests (only when the patched SITL built)
        run: |
          bin="$RUNNER_TEMP/bf/obj/main/betaflight_SITL.elf"
          if [ -x "$bin" ]; then
            export OFS_SITL_LAUNCH="$bin"
            bash scripts/macos-survey.sh sitl-live-ofs-fc cargo test -p ofs-fc --test sitl_live --locked -- --ignored --test-threads=1
            bash scripts/macos-survey.sh sitl-live-ofs-sim cargo test -p ofs-sim --test sitl_live --locked -- --ignored --test-threads=1
            bash scripts/macos-survey.sh sitl-live-vtx cargo test -p ofs-video --test vtx_live --locked -- --ignored --test-threads=1
            python3 -m pip install -e "python[dev]" > survey/pip.log 2>&1 || python3 -m pip install -e python grpcio-tools pytest mcap pandas pyarrow build >> survey/pip.log 2>&1
            bash scripts/macos-survey.sh sitl-python python3 -m pytest python/tests -v -k sitl
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iterate-${{ matrix.os }}
          path: survey/
