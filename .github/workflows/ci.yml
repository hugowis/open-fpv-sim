name: ci
on: [push, pull_request]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests -v
      - run: python -m pytest tools/sitegen/tests -q
      # Parent spec §8.5, tracked, not gating: the worked validation report in the job summary. It fails only when
      # the shipped submission is invalid; the model's error against it never fails the build (docs/validation.md).
      - run: cargo run -p ofs-validate --locked -- validation/thrust-stand/example-2207-5in --summary

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # ofs-godot alone needs a newer Rust (godot-rust 0.5.5); the stable jobs cover it.
      - run: cargo check --workspace --all-targets --locked --exclude ofs-godot

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: cargo test --workspace --locked
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      # Without OFS_SITL_LAUNCH the SITL tests skip (no WSL SITL on the runner).
      - run: python -m pytest python/tests -v
      - run: python -m pytest tools/sitegen/tests -q

  # Apple silicon (docs/research/macos.md): the Rust tests, the live Betaflight tests, every Python test with SITL, and the
  # Godot suites with the game flying Betaflight. Not in `publish`'s needs: macOS is supported best-effort for now.
  macos:
    runs-on: macos-latest
    # Shown as passing even when it fails, until it has a track record (docs/research/macos.md: about ten green runs); the
    # failure is still listed in the run and its annotations.
    continue-on-error: true
    env:
      BF_DIR: ${{ github.workspace }}/../betaflight
      OFS_SITL_LAUNCH: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - id: sitl-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
          key: sitl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-sitl.sh', 'third_party/betaflight/**') }}
      - if: steps.sitl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-sitl.sh
      # One test at a time: on macOS a port a test just released was sometimes still held (a child another test thread
      # was spawning inherited the descriptor, most likely), which failed tests that bind, drop and rebind.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo test -p ofs-fc -p ofs-sim --test sitl_live --locked -- --ignored --test-threads=1
      - run: cargo test -p ofs-video --test vtx_live --locked -- --ignored --test-threads=1
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      # OFS_SITL_LAUNCH is set, so the Betaflight tests run too.
      - run: python -m pytest python/tests -v
      - uses: actions/cache@v6
        with:
          path: build/godot-dl
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/run-godot-tests.sh') }}
      # The game flies a real-time session: the server must keep the wall clock. A debug server has a few times of
      # headroom on this runner and fell more than 100 ms behind in 9 of the 10 macOS Godot failures between
      # 2026-10-19 and 2026-10-24 (#118), which holds the picture and starves the DVR checks; a release one has ~8x more.
      - run: cargo build --release -p ofs-sim --locked
      - run: bash scripts/run-godot-tests.sh all
        env:
          OFS_SIM_BIN: ${{ github.workspace }}/target/release/ofs-sim

  godot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: build/godot-dl
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/run-godot-tests.sh') }}
      # Builds ofs-sim + ofs-godot, downloads Godot 4.7.2 (checked against the pinned SHA-512),
      # runs the unit suites and the open-loop and error e2e; the Betaflight e2e skips.
      - run: bash scripts/run-godot-tests.sh all

  sitl:
    runs-on: ubuntu-24.04
    env:
      BF_DIR: ${{ github.workspace }}/../betaflight
      OFS_SITL_LAUNCH: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # The SITL binary only changes with the build script or the patch: reuse it instead of rebuilding Betaflight.
      - id: sitl-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
          key: sitl-${{ runner.os }}-${{ hashFiles('scripts/build-sitl.sh', 'third_party/betaflight/**') }}
      - if: steps.sitl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-sitl.sh
      - run: cargo test -p ofs-fc -p ofs-sim --test sitl_live --locked -- --ignored --test-threads=1
      - run: cargo test -p ofs-video --test vtx_live --locked -- --ignored --test-threads=1
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests/test_sitl_hover.py python/tests/test_sitl_link.py python/tests/test_sitl_radio.py python/tests/test_sitl_telemetry.py python/tests/test_sitl_tramp.py python/tests/test_sitl_video.py python/tests/test_sitl_faults.py python/tests/test_sitl_sandbox.py python/tests/test_sitl_circuit.py python/tests/test_sitl_parallel.py -v
      # The package as PyPI would ship it (spec §8): the built wheel alone in a clean venv runs the §6.2 example
      # against real Betaflight. Run from the repository root, `import ofs` finds the installed wheel, not python/.
      - run: python -m build python --outdir dist
      - run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install "$(ls dist/*.whl)[log]" pytest
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import ofs; assert 'site-packages' in ofs.__file__, ofs.__file__"
          OFS_SIM_BIN=target/debug/ofs-sim "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest python/tests/test_sitl_sandbox.py -v
      # Parent spec §8.6: the real-time factor of headless runs, in the job summary. Two checks: the floor (below 1x
      # real time always fails) and the regression gate (a row under 60 % of its baseline in
      # scripts/benchmark-baseline.json fails; each row is the best of 2 runs because noise only slows a run down).
      # To accept a slowdown on purpose, update that baseline in the PR, or set the repository variable
      # OFS_BENCH_ACCEPT_SLOWER to the reason: the table then says ACCEPTED and the job passes.
      - run: cargo build -p ofs-sim --release --locked
      - run: python scripts/benchmark.py --binary target/release/ofs-sim --summary --floor 1 --repeat 2 --baseline scripts/benchmark-baseline.json --runner ci-linux
        env:
          OFS_BENCH_ACCEPT_SLOWER: ${{ vars.OFS_BENCH_ACCEPT_SLOWER }}
      - uses: actions/cache@v6
        with:
          path: build/godot-dl
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/run-godot-tests.sh') }}
      # The game against real Betaflight (OFS_SITL_LAUNCH is set above): arm, climb, failsafe on a radio cut, reload.
      # The runner builds ofs-sim and ofs-godot and downloads the pinned Godot itself.
      - run: bash scripts/run-godot-tests.sh e2e

  # The native Windows SITL (no WSL; docs/research/sitl-native-windows.md): built in MSYS2's msys environment, then the
  # live tests run against the .exe from the runner's plain PowerShell (no MSYS2 on PATH). Gates `publish` (promoted
  # 2026-10-31, after 13 consecutive green runs); the macOS job is the one still waiting on a clean record (#118).
  windows-sitl:
    runs-on: windows-latest
    env:
      # Betaflight's make cannot build in a path with spaces; one fixed directory, in both path flavours.
      BF_DIR: C:/ofs/betaflight
      OFS_SITL_LAUNCH: C:\ofs\betaflight\obj\main\betaflight_SITL.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # The executable and the Cygwin runtime DLLs it needs only change with the build script or the patches.
      - id: sitl-cache
        uses: actions/cache@v6
        with:
          path: |
            C:\ofs\betaflight\obj\main\betaflight_SITL.exe
            C:\ofs\betaflight\obj\main\msys-2.0.dll
            C:\ofs\betaflight\obj\main\msys-gcc_s-seh-1.dll
          key: sitl-${{ runner.os }}-msys-${{ hashFiles('scripts/build-sitl-windows.sh', 'third_party/betaflight/**') }}
      - if: steps.sitl-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          release: false
          update: true
          install: base-devel git patch diffutils python gcc make
      # An undefined symbol at the link is listed by name (the stub file win_stubs.c does not cover a new tag).
      - if: steps.sitl-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-sitl-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: betaflight-sitl-windows
          path: |
            C:\ofs\betaflight\obj\main\betaflight_SITL.exe
            C:\ofs\betaflight\obj\main\msys-2.0.dll
            C:\ofs\betaflight\obj\main\msys-gcc_s-seh-1.dll
          if-no-files-found: error
          retention-days: 14
      - run: cargo test -p ofs-fc -p ofs-sim --test sitl_live --locked -- --ignored --test-threads=1
      - run: cargo test -p ofs-video --test vtx_live --locked -- --ignored --test-threads=1
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests/test_sitl_hover.py python/tests/test_sitl_link.py python/tests/test_sitl_radio.py python/tests/test_sitl_telemetry.py python/tests/test_sitl_tramp.py python/tests/test_sitl_video.py python/tests/test_sitl_faults.py python/tests/test_sitl_sandbox.py python/tests/test_sitl_circuit.py python/tests/test_sitl_parallel.py -v
      # The native real-time factor, in the job summary. No baseline yet (scripts/benchmark-baseline.json has no Windows
      # row): the floor only, until a few runs say what is normal.
      - run: cargo build -p ofs-sim --release --locked
      - run: python scripts/benchmark.py --binary target/release/ofs-sim.exe --summary --floor 1 --repeat 2

  # PyPI, on version tags only (v*): nothing publishes from merges or branch pushes. Trusted publishing: the PyPI
  # project trusts this workflow's `pypi` environment, so no token is stored. The first tag that publishes is the
  # maintainer's call.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows, sitl, windows-sitl]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    # The actions here are pinned to commit SHAs: this job can publish to PyPI, so a moved tag must not change what
    # runs in it. Dependabot (.github/dependabot.yml) proposes the updates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag names the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match the package version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
