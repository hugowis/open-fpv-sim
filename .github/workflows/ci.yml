name: ci
on: [push, pull_request]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests -v

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # ofs-godot alone needs a newer Rust (godot-rust 0.5.5); the stable jobs cover it.
      - run: cargo check --workspace --all-targets --locked --exclude ofs-godot

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: cargo test --workspace --locked
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      # Without OFS_SITL_LAUNCH the SITL tests skip (no WSL SITL on the runner).
      - run: python -m pytest python/tests -v

  godot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: build/godot-dl
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/run-godot-tests.sh') }}
      # Builds ofs-sim + ofs-godot, downloads Godot 4.7.2 (checked against the pinned SHA-512),
      # runs the unit suites and the open-loop and error e2e; the Betaflight e2e skips.
      - run: bash scripts/run-godot-tests.sh all

  sitl:
    runs-on: ubuntu-24.04
    env:
      BF_DIR: ${{ github.workspace }}/../betaflight
      OFS_SITL_LAUNCH: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # The SITL binary only changes with the build script or the patch: reuse it instead of rebuilding Betaflight.
      - id: sitl-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../betaflight/obj/main/betaflight_SITL.elf
          key: sitl-${{ runner.os }}-${{ hashFiles('scripts/build-sitl.sh', 'third_party/betaflight/**') }}
      - if: steps.sitl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-sitl.sh
      - run: cargo test -p ofs-fc -p ofs-sim --test sitl_live --locked -- --ignored --test-threads=1
      - run: cargo test -p ofs-video --test vtx_live --locked -- --ignored --test-threads=1
      - run: cargo build -p ofs-sim --locked
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests/test_sitl_hover.py python/tests/test_sitl_radio.py python/tests/test_sitl_video.py -v
      - uses: actions/cache@v4
        with:
          path: build/godot-dl
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/run-godot-tests.sh') }}
      # The game against real Betaflight (OFS_SITL_LAUNCH is set above): arm, climb, failsafe on a radio cut, reload.
      # The runner builds ofs-sim and ofs-godot and downloads the pinned Godot itself.
      - run: bash scripts/run-godot-tests.sh e2e
