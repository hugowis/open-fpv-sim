# OpenDrone 7" long-range propeller (a low-pitch, 7 x 4 class blade) - estimates. Units are in the key suffixes (SI), tables are indexed by rpm.
schema_version = 1
name = "OpenDrone 7in prop"

[prop]
diameter_m = 0.178
inertia_kgm2 = 2e-05
ct_table = [[0.0, 0.12], [60000.0, 0.12]]
cp_table = [[0.0, 0.05], [60000.0, 0.05]]
imbalance_kgm = 0.0
