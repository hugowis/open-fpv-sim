[provenance."prop.ct_table"]
source = "estimated"
note = "flat-table estimate: a large, low-pitch blade turns well at low rpm; slightly above opendrone-5in-prop's 0.11; not measured"
[provenance."prop.cp_table"]
source = "estimated"
note = "flat-table estimate: a little above opendrone-5in-prop's 0.045 for the longer blade; not measured"
[provenance."prop.imbalance_kgm"]
source = "estimated"
