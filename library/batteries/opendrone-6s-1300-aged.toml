# OpenDrone 6S 1300 mAh pack, worn: 150 cycles in, with one tired cell. The same pack as opendrone-6s-1300 plus ageing
# and a per-cell spread. Hardware only; initial_soc and rate_hz are the quad's wiring.
schema_version = 1
name = "OpenDrone 6S 1300 mAh, aged"

[battery]
cells = 6
capacity_mah = 1300.0
r0_ohm = 0.024
r1_ohm = 0.010
c1_f = 2000.0
ocv_table = [[0.0, 3.27], [0.05, 3.61], [0.1, 3.69], [0.2, 3.73], [0.3, 3.77], [0.4, 3.79],
             [0.5, 3.82], [0.6, 3.87], [0.7, 3.92], [0.8, 3.97], [0.9, 4.06], [1.0, 4.20]]
cell_r0_scale = [1.0, 1.0, 1.0, 1.2, 1.0, 1.0]
cycles = 150
capacity_fade_per_cycle = 0.001
resistance_growth_per_cycle = 0.004

