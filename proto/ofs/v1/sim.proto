syntax = "proto3";

package ofs.v1;

// Simulator control, protocol version 17: protocol 16 plus the world's triangle meshes (World.meshes: path and digest).
// Protocol 16 was protocol 15 plus the baked terrain height grid (World.terrain).
// Protocol 15 was protocol 14 plus named courses and race modes (World.courses,
// RaceState.course/mode/time_limit_s/time_left_s, ResetRace choosing a course, RACE_MODE_TIME_ATTACK).
// Protocol 14 was protocol 13 plus the loaded parts' provenance on LoadReply, gate tilt and
// clipped passes (Gate.pitch_deg/roll_deg, GATE_HIT), and the lap limit and race reset (RaceState.finished/lap_limit,
// RACE_FINISHED, RACE_RESET, ResetRace).
// Protocol 13 added the downlink-loss fault.
// Protocol 12 added the open-loop stabilizer on Load (M8b).
// Protocol 11 added gates, lap timing and the race state (M8a).
// Protocol 10 added recording a live flight's sticks to a replayable CSV (M5).
// Protocol 9 added recording the bus to MCAP, scripted stick inputs, faults scheduled at a simulated time and world
// names (M4c).
// Still: lockstep and real-time sessions, state and event streams, the pilot link, the v1 fault catalog, OSD and
// VTX state, and the world with its analog video link. One session (loaded quad) per server.
service Sim {
  rpc Handshake(HandshakeRequest) returns (HandshakeReply);
  rpc Load(LoadRequest) returns (LoadReply);
  rpc SetSticks(Sticks) returns (Empty);
  // Steps a lockstep session, or a paused real-time session (single-stepping).
  rpc Run(RunRequest) returns (State);
  // Real-time sessions load paused; Start paces them to the wall clock, Pause stops them.
  rpc Start(Empty) returns (Empty);
  rpc Pause(Empty) returns (Empty);
  rpc GetState(Empty) returns (State);
  rpc Unload(Empty) returns (Empty);
  // Vehicle state at a client rate until the client cancels or the session is unloaded.
  rpc StreamState(StreamRequest) returns (stream State);
  // The pilot's transmitter: sticks in, state out. While the stream is open the transmitter is on; when it
  // closes (or the client vanishes) the transmitter goes off and Betaflight fails safe. One pilot at a time.
  rpc Pilot(stream PilotInput) returns (stream State);
  // Session events. A session loaded with keep_alive = false ends when its last watcher disconnects.
  rpc Watch(Empty) returns (stream Event);
  rpc InjectFault(Fault) returns (Empty);
  rpc ClearFaults(Empty) returns (Empty);
  // Betaflight's OSD as a character grid (present = false, 0 columns, when the quad has no OSD).
  rpc GetOsd(Empty) returns (OsdFrame);
  // OSD frames: the current one at once, then each time the grid changes or the OSD appears or disappears,
  // checked at up to rate_hz (1..60; 0 means 60).
  rpc StreamOsd(StreamRequest) returns (stream OsdFrame);
  // The world the session flies in, as loaded and validated (the built-in open field when Load named none).
  rpc GetWorld(Empty) returns (World);
  // Records the bus to a new MCAP file the server names (<data_dir>/logs/<quad>-<n>.mcap); one at a time.
  rpc StartRecording(StartRecordingRequest) returns (RecordingStarted);
  // Finishes the running recording's file (it is readable from then on).
  rpc StopRecording(Empty) returns (RecordingSummary);
  // Plays a stick-inputs CSV sample-and-hold from now; SetSticks is refused while it plays. The file travels in the
  // request: the server reads no client paths.
  rpc PlayInputs(InputsFile) returns (Empty);
  // Stops the playing inputs file, if any (the sticks keep their last values).
  rpc StopInputs(Empty) returns (Empty);
  // Records the session's sticks to a stick-inputs CSV the server names (<data_dir>/logs/<quad>-inputs-<n>.csv): a row
  // whenever a stick changes, in PlayInputs' format, so PlayInputs replays the flight's sticks in lockstep. One at a
  // time; refused while an inputs file plays, and PlayInputs is refused while it runs (it records live sticks only).
  // The file is finished by StopInputsRecording, Unload, a new Load or the session ending.
  rpc StartInputsRecording(Empty) returns (InputsRecordingStarted);
  // Finishes the running inputs recording's file.
  rpc StopInputsRecording(Empty) returns (InputsRecordingSummary);
  // Starts a fresh race at the next tick (docs/race-timing.md), on the named course (empty: the current one);
  // FAILED_PRECONDITION when the world has no gates, INVALID_ARGUMENT for a course the world does not declare.
  rpc ResetRace(ResetRaceRequest) returns (Empty);
}

message Empty {}

message ResetRaceRequest { string course = 1; }

message HandshakeRequest { uint32 protocol_version = 1; }
message HandshakeReply {
  uint32 protocol_version = 1;
  string server_version = 2;
  string logs_dir = 3;  // absolute: where recordings and copied Blackbox logs land
}

enum Mode {
  MODE_UNSPECIFIED = 0;  // treated as lockstep
  MODE_LOCKSTEP = 1;
  MODE_REALTIME = 2;
}

// What a real-time session does when it falls behind the wall clock (spec §5.1).
enum OverrunPolicy {
  OVERRUN_POLICY_UNSPECIFIED = 0;  // treated as warn
  OVERRUN_POLICY_WARN = 1;         // catch up in bursts; drop a backlog over 100 ms and count an overrun
  OVERRUN_POLICY_SLOW = 2;         // never burst; simulated time stretches, one overrun per 100 ms of stretch
}

message LoadRequest {
  string quad_path = 1;
  uint64 seed = 2;
  Mode mode = 3;
  bool open_loop_fc = 4;  // testing aid: replace the configured FC with throttle-only open loop
  OverrunPolicy overrun_policy = 5;
  bool keep_alive = 6;  // keep the session when its last watcher disconnects
  // A world file (worlds/flat.toml), or a world name (flat: worlds/flat.toml beside the quad's directory, as
  // parts resolve against library/); empty: the built-in open field.
  string world_path = 7;
  // With open_loop_fc: also run the built-in angle-mode stabilizer (a test stand-in, not Betaflight), so sticks
  // command attitude and a script can fly a path. Refused without open_loop_fc.
  bool stabilize = 8;
}
message LoadReply {
  string quad_name = 1;
  uint32 base_hz = 2;
  string configurator_address = 3;  // the slot's Configurator address (tcp://127.0.0.1:5761 for slot 0) when the FC is Betaflight SITL, else empty
  repeated PartInfo parts = 4;      // the library parts the quad loaded: frame, motors, props, escs, battery, vtx
}

// A library part the quad loaded and where each of its numbers came from.
message PartInfo {
  string kind = 1;  // frame | motor | prop | esc | battery | vtx
  string id = 2;    // the library id the quad referenced (a single motor/prop/esc id covers every position)
  string name = 3;  // the part file's own name
  repeated ParamProvenance provenance = 4;  // sorted by path
}
message ParamProvenance {
  string path = 1;    // the parameter, dotted (motor.kv)
  string source = 2;  // datasheet | measured | estimated
  string link = 3;
  string note = 4;
}

// roll, pitch, yaw, aux in [-1, 1]; throttle in [0, 1]. Up to 4 aux channels; missing ones are -1.
message Sticks {
  double roll = 1;
  double pitch = 2;
  double yaw = 3;
  double throttle = 4;
  repeated double aux = 5;
}

message RunRequest { double seconds = 1; }

// rate_hz: 1..240; 0 means 60.
message StreamRequest { uint32 rate_hz = 1; }

message PilotInput {
  Sticks sticks = 1;
  uint32 state_rate_hz = 2;  // read from the first message only; 0 means 60
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}
message Quat {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message RadioLink {
  bool tx_enabled = 1;  // a pilot or script is connected
  bool link_up = 2;
  double lq_pct = 3;
  double rssi_dbm = 4;         // at the antenna in use
  double snr_db = 5;           // may be negative: LoRa decodes below the noise
  string active_antenna = 6;   // the quad file's antenna name
  double downlink_lq_pct = 7;  // what the handset receives
}

// Betaflight's own telemetry as the handset received it over the ELRS downlink. age is INFINITY
// until the first frame arrives (and always INFINITY without SITL): the HUD dashes.
message FcTelemetry {
  double battery_v = 1;    // Betaflight's filtered pack voltage
  double battery_a = 2;
  double battery_mah = 3;  // drawn so far (Betaflight's ESC-sensor value)
  double roll_deg = 4;     // Betaflight's attitude estimate, not the simulator's truth
  double pitch_deg = 5;
  double yaw_deg = 6;
  string flight_mode = 7;  // Betaflight's mode string ("ACRO", "AIR *", "!FS!", ...)
  uint64 frame_count = 8;
  double telemetry_age_s = 9;
}

// One OSD screen. cells are row-major (rows * cols entries), each `char | font_page << 8 | blink << 10`; the
// character codes index Betaflight's OSD font (printable ASCII is ASCII, symbols are font glyphs).
message OsdFrame {
  uint64 seq = 1;      // moves when the cells change
  double time_s = 2;   // simulated time of the sample
  bool present = 3;    // false: no OSD, released, or silent for a second
  uint32 cols = 4;
  uint32 rows = 5;
  repeated uint32 cells = 6;
}

// The video transmitter.
message Vtx {
  bool present = 1;     // a VTX is wired to the flight controller
  uint32 band = 2;      // 1..6 = A, B, E, F, R, L; 0 in user-frequency mode
  uint32 channel = 3;   // 1..8; 0 in user-frequency mode
  uint32 freq_mhz = 4;
  uint32 power_mw = 5;
  bool pit_mode = 6;
}

// The analog video link at the goggles (present = false without a VTX).
enum VideoSync {
  VIDEO_SYNC_UNSPECIFIED = 0;  // no video link
  VIDEO_SYNC_LOCKED = 1;
  VIDEO_SYNC_UNSTABLE = 2;     // tearing, line jitter
  VIDEO_SYNC_LOST = 3;         // rolling, static
}

message AntennaRssi {
  string name = 1;
  double rssi_dbm = 2;
}

message VideoLink {
  bool present = 1;
  double snr_db = 2;             // at the antenna in use
  double interference_dbm = 3;   // other emitters after the channel filter, at the antenna in use
  repeated AntennaRssi rssi = 4; // every goggle antenna, in the world file's order
  string active_antenna = 5;
  double noise = 6;     // picture grain, 0 (clean) to 1 (static)
  double sparkles = 7;  // 0 to 1
  double chroma = 8;    // colour, 1 (full) to 0 (black and white)
  VideoSync sync = 9;
  bool field_valid = 10;         // false: the receiver dropped this field (marginal signal)
  uint32 latency_ms = 11;        // the goggles' glass-to-glass latency, quantized down to whole fields
}

message State {
  double time_s = 1;
  Vec3 position_ned_m = 2;
  Vec3 velocity_ned_mps = 3;
  Quat attitude = 4;  // FRD body -> NED world
  Vec3 rate_frd_radps = 5;
  double battery_voltage_v = 6;
  double battery_current_a = 7;
  repeated double motor_rpm = 8;
  repeated double motor_cmd = 9;
  RadioLink radio = 10;
  bool running = 11;        // a real-time session paced to the wall clock right now
  uint64 overruns = 12;     // real-time overruns so far
  uint32 fc_restarts = 13;  // Betaflight reboots so far
  Vtx vtx = 14;
  uint64 serial_dropped_bytes = 15;  // Betaflight UART output dropped because a consumer fell behind
  VideoLink video = 16;
  double collision_speed_mps = 17;   // the last collision's inward speed (0 until one happens)
  FcTelemetry fc_telemetry = 18;
  repeated double battery_cell_voltages = 19;  // per-cell voltage (each cell's own state; the weak cell droops)
  RaceState race = 20;
}

// The lap clock. present is false in a world without gates (every other field is then zero). last_lap_s and
// best_lap_s are 0 until a lap completes (laps > 0 says they are real).
message RaceState {
  bool present = 1;
  bool running = 2;           // gate 0 has started the clock (and the lap limit is not reached)
  uint32 next_gate = 3;       // the gate to fly through next (0 before the start and after the last gate)
  uint32 gate_count = 4;
  uint32 laps = 5;            // completed
  double current_lap_s = 6;   // time since the current lap started
  double last_lap_s = 7;
  double best_lap_s = 8;
  bool finished = 9;          // the lap limit is reached: the clock has stopped, nothing counts until ResetRace
  uint32 lap_limit = 10;      // the course's lap limit (0 = none; always 0 in time attack)
  string course = 11;         // the course being raced; empty for a world without [[courses]]
  uint32 course_index = 12;   // its place in World.courses (0 for the implicit course)
  RaceMode mode = 13;
  double time_limit_s = 14;   // time attack: the clock (0 in a lap race)
  double time_left_s = 15;    // time attack: the limit before the start, what is left while running, 0 once over
}

// How a race is won.
enum RaceMode {
  RACE_MODE_LAPS = 0;         // fly the laps (the lap limit, or forever)
  RACE_MODE_TIME_ATTACK = 1;  // as many laps as fit before time_limit_s runs out
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_OVERRUN = 1;
  EVENT_KIND_FIRMWARE_RESTARTED = 2;
  EVENT_KIND_SIM_ERROR = 3;
  EVENT_KIND_LINK_DOWN = 4;
  EVENT_KIND_LINK_UP = 5;
  EVENT_KIND_PILOT_CONNECTED = 6;
  EVENT_KIND_PILOT_DISCONNECTED = 7;
  EVENT_KIND_SESSION_ENDED = 8;
  EVENT_KIND_VTX_CHANGED = 9;
  EVENT_KIND_SERIAL_OVERFLOW = 10;
  EVENT_KIND_VIDEO_LOST = 11;      // the goggles lost sync
  EVENT_KIND_VIDEO_RESTORED = 12;  // and found it again
  EVENT_KIND_COLLISION = 13;       // the quad hit something: the message names the object and the speed
  EVENT_KIND_FAULT_INJECTED = 14;  // a fault became active: the message names it
  EVENT_KIND_FAULT_CLEARED = 15;   // a fault stopped being active: the message names it
  EVENT_KIND_INPUTS_STARTED = 16;  // an inputs file started playing: the message names it
  EVENT_KIND_INPUTS_ENDED = 17;    // it finished or was stopped (the message says which)
  EVENT_KIND_RECORDING_STARTED = 18;  // the message is the file's path
  EVENT_KIND_RECORDING_STOPPED = 19;  // stopped, or failed (a disk error): the message says which
  EVENT_KIND_INPUTS_RECORDING_STARTED = 20;  // the message is the file's path
  EVENT_KIND_INPUTS_RECORDING_STOPPED = 21;  // stopped, or failed (a disk error): the message says which
  // The message is "<name> (gate <i>) start" or "<name> (gate <i>) split <s> s"; the event's time is the crossing's.
  EVENT_KIND_GATE_PASSED = 22;
  // The message is "lap <n>: <s> s", with " (best)" appended when it is the fastest lap so far (the first is).
  EVENT_KIND_LAP_COMPLETED = 23;
  // The quad went through the next gate's opening but its bounding sphere did not fit: no credit, the gate is still
  // next. The message is "<name> (gate <i>) hit"; the event's time is the crossing's.
  EVENT_KIND_GATE_HIT = 24;
  // The world's lap limit was reached: the clock has stopped and nothing counts until ResetRace. The message is
  // "race finished: <n> laps"; the event's time is the last crossing's, and a lap_completed event comes first.
  EVENT_KIND_RACE_FINISHED = 25;
  // ResetRace was applied at a tick: no clock, no laps, no best time, gate 0 next. The message is "race reset".
  EVENT_KIND_RACE_RESET = 26;
}

message Event {
  double time_s = 1;  // simulated time
  EventKind kind = 2;
  string message = 3;
}

message RadioLinkLoss {}

message RadioLoss {
  double fraction = 1;  // extra per-packet loss probability, [0, 1]
}

message DownlinkLoss {
  double fraction = 1;  // downlink packet-loss probability, [0, 1]
}

message BurstLoss {
  uint32 on_ms = 1;   // the window loses every uplink packet
  uint32 off_ms = 2;  // then delivers normally; both > 0
}

message MotorFailure {
  uint32 motor = 1;  // 0-based motor index
  double scale = 2;  // torque/current scale, [0, 1]; 0 = dead motor
}

message PropDamage {
  uint32 prop = 1;            // 0-based prop index
  double thrust_scale = 2;    // thrust and torque scale, >= 0
  double imbalance_kgm = 3;   // vibration amplitude (m·r), >= 0
}

message WeakCell {
  uint32 cell = 1;            // 0-based cell index
  double r_offset_ohm = 2;    // extra series resistance
  double v_offset_v = 3;      // extra voltage drop
}

message GyroFault {
  Vec3 bias_radps = 1;       // added to the IMU's gyro bias
  double noise_scale = 2;    // multiplies the gyro noise std, >= 0
}

message VtxInterference {
  double freq_mhz = 1;
  double power_mw = 2;
  Vec3 position_ned_m = 3;
}

message Fault {
  oneof kind {
    RadioLinkLoss radio_link_loss = 1;  // every uplink packet is lost while active
    RadioLoss radio_loss = 2;
    BurstLoss burst_loss = 3;
    MotorFailure motor_failure = 4;
    PropDamage prop_damage = 5;
    WeakCell weak_cell = 6;
    GyroFault gyro_fault = 7;
    VtxInterference vtx_interference = 8;
    DownlinkLoss downlink_loss = 10;
  }
  optional double at_s = 9;  // activate at this simulated time (absent: now); refused once that time has passed
}

// A recorded signal pattern: `*` matches any run of characters (dots included), `?` one character.
message RecordingSignal {
  string pattern = 1;
  double rate_hz = 2;  // 0: each matched signal's rate from the default table
}

message StartRecordingRequest {
  repeated RecordingSignal signals = 1;  // empty: every signal at the default table's rates
}

message RecordingStarted {
  string path = 1;
  repeated string signals = 2;  // the recorded signals' bus names
}

message RecordingSummary {
  string path = 1;
  uint64 messages = 2;
  double first_s = 3;  // simulated time of the first and last record (0 when there are none)
  double last_s = 4;
}

// A stick-inputs CSV: header t_s plus any of roll, pitch, yaw, throttle, aux1..aux4; t_s increasing from 0.
message InputsFile {
  string name = 1;  // shown in errors and events (the client sends the file's name)
  string csv = 2;
}

message InputsRecordingStarted {
  string path = 1;
}

message InputsRecordingSummary {
  string path = 1;
  uint64 rows = 2;
  double duration_s = 3;  // the time of the last row
}

// The world file, NED metres from home (up is negative). Strings name the kinds: antenna "omni" or "patch";
// polarization "rhcp", "lhcp" or "linear"; shape "box" or "cylinder".
message ReceiverAntenna {
  string name = 1;
  string kind = 2;
  double gain_dbi = 3;
  double beamwidth_deg = 4;  // patch only, else 0
  string polarization = 5;
  double aim_az_deg = 6;     // relative to the pilot's facing, clockwise
  double aim_el_deg = 7;     // up
}

message WorldObject {
  string name = 1;
  string shape = 2;
  Vec3 center_ned_m = 3;
  Vec3 size_m = 4;      // box: north, east, height
  double radius_m = 5;  // cylinder
  double height_m = 6;  // cylinder
  Vec3 color = 7;       // r, g, b in 0..1
  double rf_loss_db = 8;
}

// A gate: an opening flown through in the direction of heading_deg (0 = north, clockwise), upright unless tilted.
// Gate 0 is the start and finish; the gates are listed in course order.
message Gate {
  string name = 1;
  Vec3 center_ned_m = 2;
  double heading_deg = 3;
  double width_m = 4;
  double height_m = 5;
  double pitch_deg = 6;  // aerospace Z-Y-X after the heading: positive lifts the direction of travel (top leans back)
  double roll_deg = 7;   // positive turns the opening clockwise seen from the approach
}

message Emitter {
  string name = 1;
  Vec3 position_ned_m = 2;
  double freq_mhz = 3;
  double power_mw = 4;
}

// The pilot's handset: where it is and what transmits from it (the ELRS uplink).
message Handset {
  Vec3 position_ned_m = 1;
  repeated ReceiverAntenna antennas = 2;
}

message World {
  string name = 1;
  Vec3 pilot_position_ned_m = 2;
  double pilot_facing_deg = 3;  // degrees clockwise from north
  repeated ReceiverAntenna antennas = 4;
  repeated WorldObject objects = 5;
  repeated Emitter emitters = 6;
  Handset handset = 7;
  repeated Gate gates = 8;
  // The courses [[courses]] declares, in file order; empty means one unnamed course of all the gates.
  repeated Course courses = 9;
  uint32 default_course = 10;  // the course a fresh session starts in (an index into courses)
  Terrain terrain = 11;        // absent: the ground is the plane d = 0
  repeated Mesh meshes = 12;   // the [[meshes]] in file order; the client loads each .glb itself
}

// A triangle mesh placed in the world. The bytes stay in the file: the client reads `path` (absolute on the
// simulator's machine) and refuses the world unless the file's FNV-1a 64 hash is `digest`.
message Mesh {
  string name = 1;
  string path = 2;
  Vec3 position_ned_m = 3;
  double heading_deg = 4;  // clockwise from north
  fixed64 digest = 5;
}

// The baked terrain: a regular grid of heights the simulator's physics samples. Beyond the grid the ground is the
// plane d = 0. A big grid is a big reply (1025 x 1025 is over 4 MiB): clients raise their receive limit.
message Terrain {
  double origin_north_m = 1;  // node (0, 0), NED metres from home
  double origin_east_m = 2;
  double cell_m = 3;
  uint32 nodes_n = 4;
  uint32 nodes_e = 5;
  repeated float heights = 6;  // metres up, row-major, north the slow index: nodes_n * nodes_e values
  fixed64 digest = 7;          // ofs_core::terrain::Terrain::digest of the grid (includes the origin)
}

// A named course: some of the world's gates, in order (the first is the start and finish).
message Course {
  string name = 1;
  repeated string gates = 2;  // declared gate names
  RaceMode mode = 3;
  uint32 laps = 4;            // the lap limit that applies (0 = none)
  double time_limit_s = 5;    // time attack only
}
