# OpenDrone 5R race - a 5" 220 mm race quad on the shipped 6S 1300 mAh pack, assembled from library parts (every value an
# estimate, see docs/research/component-library.md). The sharp, hungry one: all-up weight 540 g against the freestyle's
# 650 g, thrust-to-weight 14.8 at full throttle, hover at 19 % throttle drawing 86 W, a 2306 2450KV motor on a steep
# race prop behind a 60 A ESC, and the datasheet-sourced ICM-42688-P IMU. The numbers are pinned by
# crates/ofs-sim/tests/quads.rs.
schema_version = 6
name = "OpenDrone 5R race"

frame = "opendrone-5r"
motors = ["opendrone-motor-2306"]
props = ["opendrone-5in-race-prop"]
escs = ["opendrone-4in1-esc-60a"]
imu = "tdk-icm-42688p"
baro = "opendrone-baro"

[battery]
part = "opendrone-6s-1300"
initial_soc = 1.0
rate_hz = 1000

[sim]
base_hz = 8000

[home]
lat_deg = 50.85
lon_deg = 4.35
alt_m = 30.0

[initial]
position_ned_m = [0.0, 0.0, -0.03]
yaw_deg = 0.0

[fc]
kind = "sitl"
exchange_hz = 1000
# Overridden by the OFS_SITL_LAUNCH / OFS_SITL_CLEANUP environment variables (space-separated argv).
# An empty cleanup removes the stray SITL of the session's own slot (the processes named betaflight_SITL launched
# with its --port-offset) on Linux, and under WSL (launch[0] = wsl.exe) the same inside the VM.
launch = ["betaflight_SITL.elf"]
cleanup = []
betaflight_diff = "opendrone-5r-race.betaflight.diff"
reply_timeout_ms = 500
first_reply_timeout_ms = 5000
startup_timeout_ms = 15000

[radio]
# ExpressLRS 2.4 GHz. The receiver's CRSF output is wired to Betaflight's UART2; the betaflight.diff selects
# the CRSF receiver there. RSSI, SNR and packet loss come from the geometry of the world file (M3c); the
# default receiver antenna is a 2 dBi linear dipole leaning up and back (mount_frd = [-0.5, 0.0, -1.0]).
kind = "elrs"
packet_rate_hz = 500
uart = 2
latency_packets = 1
tx_power_mw = 100

# M3a: video. Betaflight UART numbers are 1-based (as in the Configurator's Ports tab); UART1 is the MSP port.
# The battery as Betaflight's ESC sensor (KISS telemetry frames, 4 identical frames carry a quarter of the pack
# current and consumed charge each, see docs/superpowers/specs/2026-10-08-m3a-osd-vtx-design.md section 5).
[esc_telemetry]
uart = 3
rate_hz = 100

# Betaflight's OSD over MSP DisplayPort; 30x16 is the analog PAL grid (the diff sets vcd_video_system = PAL).
[osd]
uart = 4
cols = 30
rows = 16

# The VTX part is the hardware (power table, antenna); the wiring below is this aircraft's.
[vtx]
part = "opendrone-smartaudio-1w"
uart = 5
default_band = "R"
default_channel = 1
default_power_index = 0
