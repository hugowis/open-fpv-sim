[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
glam = "0.29"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
proptest = "1"
ofs-core = { path = "crates/ofs-core" }
ofs-physics = { path = "crates/ofs-physics" }
ofs-electrical = { path = "crates/ofs-electrical" }
ofs-sensors = { path = "crates/ofs-sensors" }
ofs-config = { path = "crates/ofs-config" }
ofs-fc = { path = "crates/ofs-fc" }
ofs-radio = { path = "crates/ofs-radio" }
ofs-proto = { path = "crates/ofs-proto" }
ofs-client = { path = "crates/ofs-client" }
