[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
glam = "0.29"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
proptest = "1"
# Pinned upstream, not crates.io: mcap 0.25.0 writes the summary's channel and schema records in HashMap order,
# so identical runs give different files. 00e47a1b (0.25.1, unreleased) writes them in id order
# (foxglove/mcap#1838). See docs/research/mcap-determinism.md; switch to the release once it ships.
mcap = { git = "https://github.com/foxglove/mcap.git", rev = "00e47a1b", default-features = false, features = ["zstd"] }
serde_json = "1"
# Default features off: no image decoding (the world reader needs geometry only).
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
ofs-core = { path = "crates/ofs-core" }
ofs-physics = { path = "crates/ofs-physics" }
ofs-electrical = { path = "crates/ofs-electrical" }
ofs-sensors = { path = "crates/ofs-sensors" }
ofs-config = { path = "crates/ofs-config" }
ofs-fc = { path = "crates/ofs-fc" }
ofs-radio = { path = "crates/ofs-radio" }
ofs-rf = { path = "crates/ofs-rf" }
ofs-video = { path = "crates/ofs-video" }
ofs-proto = { path = "crates/ofs-proto" }
ofs-client = { path = "crates/ofs-client" }
ofs-log = { path = "crates/ofs-log" }
ofs-sim = { path = "crates/ofs-sim" }
ofs-audio = { path = "crates/ofs-audio" }
